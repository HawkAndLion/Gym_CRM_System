# ==============================
# Application
# ==============================
spring.application.name=gym-crm
server.port=8080

# ==============================
# PostgreSQL
# ==============================
spring.datasource.url=jdbc:postgresql://postgres-db:5432/trainer_workload_db
#spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/trainer_workload_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Eureka
# ==============================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==============================
# JWT
# ==============================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# ==============================
# ActiveMQ / JMS
# ==============================
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://activemq:61616}
spring.activemq.user=${ACTIVEMQ_USER:admin}
spring.activemq.password=${ACTIVEMQ_PASSWORD:admin}
spring.activemq.packages.trust-all=true

app.service.name=${ACTIVEMQ_TOKEN_NAME:gym-crm-service}
app.jms.destination=trainer.workload.queue

# ==============================
# OpenAPI / Swagger
# ==============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==============================
# Management / Metrics
# ==============================
management.endpoints.web.exposure.include=info,health,metrics,beans,env,loggers,prometheus
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# ==============================
# Logging
# ==============================
logging.level.root=INFO
logging.level.org.springframework.security=TRACE
